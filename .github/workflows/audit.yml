name: Audit and Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan / Lean
        run: |
          curl -sSf https://elan-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Lake cache (download Mathlib cache)
        run: lake exe cache get || true

      - name: Lake build
        run: lake build

      - name: Run grep audits and #print axioms
        run: |
          set -e
          mkdir -p audit
          grep -R --line-number -E "axiom|sorry|admit" . > audit/grep-axiom-sorry.txt || true
          grep -R --line-number -F "axiom Cert_Arb_SzegoGap" . > audit/grep-cert-axiom.txt || true
          grep -R --line-number -F "#print axioms" . > audit/grep-print-axioms-locations.txt || true
          git rev-parse --verify HEAD > audit/commit.txt || true
          git rev-parse --abbrev-ref HEAD > audit/branch.txt || true

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.sha }}
          path: audit
